<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="525" viewBox="0 0 1200 525" role="img" aria-label="Capa da assinatura Jeito Fácil de Vender">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#2b1f16"/>
      <stop offset="0.55" stop-color="#1a130d"/>
      <stop offset="1" stop-color="#0e0a06"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.78" cy="0.2" r="0.7">
      <stop offset="0" stop-color="#c44e23" stop-opacity="0.55"/>
      <stop offset="0.55" stop-color="#c44e23" stop-opacity="0.12"/>
      <stop offset="1" stop-color="#c44e23" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#e88e58" stop-opacity="0.9"/>
      <stop offset="1" stop-color="#c44e23" stop-opacity="0"/>
    </linearGradient>
    <pattern id="grid" width="52" height="52" patternUnits="userSpaceOnUse">
      <path d="M52 0H0V52" fill="none" stroke="#f8f4ec" stroke-opacity="0.04" stroke-width="1"/>
    </pattern>
  </defs>

  <rect width="1200" height="525" fill="url(#bg)"/>
  <rect width="1200" height="525" fill="url(#grid)"/>
  <rect width="1200" height="525" fill="url(#glow)"/>

  <g fill="none" stroke="#e88e58">
    <circle cx="960" cy="140" r="110" stroke-opacity="0.20"/>
    <circle cx="960" cy="140" r="165" stroke-opacity="0.11"/>
    <circle cx="960" cy="140" r="225" stroke-opacity="0.06"/>
  </g>

  <g font-family="Inter, 'Helvetica Neue', Arial, sans-serif">
    <text x="76" y="112" font-size="17" font-weight="600" letter-spacing="7" fill="#e88e58">MÉTODO JFV</text>

    <text x="70" y="336" font-size="176" font-weight="800" letter-spacing="-9" fill="#f8f4ec">JFV</text>

    <rect x="76" y="368" width="104" height="3" rx="1.5" fill="url(#accent)"/>

    <text x="76" y="424" font-size="20" font-weight="500" letter-spacing="5" fill="#f8f4ec" fill-opacity="0.62">JEITO FÁCIL DE VENDER</text>
    <text x="76" y="462" font-size="17" font-weight="400" letter-spacing="1" fill="#f8f4ec" fill-opacity="0.38">Comunidade e conteúdo semanal para vender com método.</text>
  </g>
